<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================ -->
    <!-- SEO BÁSICO -->
    <!-- ============================================ -->
    <title>Comercial Uruguay — Catálogo Virtual en Valparaíso</title>
    <meta
      name="description"
      content="Catálogo virtual de Comercial Uruguay. Productos para el hogar, cumpleaños, juguetes, cabello, melamina y temporada. Pide por WhatsApp y retira en tienda en Valparaíso."
    />
    <meta name="author" content="Comercial Uruguay" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://comercial-uruguay.vercel.app/" />

    <!-- ============================================ -->
    <!-- OPEN GRAPH (WhatsApp, Facebook, LinkedIn) -->
    <!-- ============================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://comercial-uruguay.vercel.app/" />
    <meta property="og:title" content="Comercial Uruguay — Catálogo Virtual" />
    <meta
      property="og:description"
      content="Productos para el hogar, cumpleaños, juguetes y más. Pide por WhatsApp y retira en tienda en Valparaíso."
    />
    <meta
      property="og:image"
      content="https://comercial-uruguay.vercel.app/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:site_name" content="Comercial Uruguay" />

    <!-- ============================================ -->
    <!-- TWITTER CARD (X/Twitter) -->
    <!-- ============================================ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Comercial Uruguay — Catálogo Virtual" />
    <meta
      name="twitter:description"
      content="Productos para el hogar, cumpleaños, juguetes y más. Pide por WhatsApp."
    />
    <meta
      name="twitter:image"
      content="https://comercial-uruguay.vercel.app/og-image.jpg"
    />

    <!-- ============================================ -->
    <!-- FAVICON -->
    <!-- ============================================ -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ============================================ -->
    <!-- TEMA / COLOR DE BARRA (mobile) -->
    <!-- ============================================ -->
    <meta name="theme-color" content="#603060" />
  </head>
